[project]
name = "legendagents"
version = "0.1.0"
description = """
    A conversational AI game that brings historical legends to life as interactive agents, 
    allowing users to explore ideas, stories, and perspectives from the greatest minds in history."""
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.136.1",
    "langchain-core==1.4.0",
    "langchain-groq==1.1.2",
    "langchain-mongodb==0.11.0",
    "langgraph==1.2.0",
    "langgraph-checkpoint-mongodb==0.4.0",
    "opik==2.0.35",
    "pre-commit==4.6.0",
    "pydantic-settings==2.14.1",
    "pymongo==4.17.0",
    "loguru==0.7.3",
    "langchain-huggingface==1.2.2",
    "langchain-community==0.4.1",
    "wikipedia>=1.4.0",
    "ipykernel>=7.2.0",
    "pydantic==2.13.4",
    "datasketch>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.13",
]

[tool.pip]
extra-index-url = "https://download.pytorch.org/whl/cpu/torch_stable.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/philoagents"]

[tool.ruff]
target-version = "py312"
